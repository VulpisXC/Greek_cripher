<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greek Cipher Encoder</title>
<style>
  :root { color-scheme: dark; --bg:#10131b; --panel:#1b2030; --line:#333b50; --text:#f3f5fb; --muted:#aab3c8; --accent:#9b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:24px 16px; display:flex; justify-content:center; align-items:flex-start; background:radial-gradient(ellipse at top,#222343 0%,var(--bg) 58%); color:var(--text); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { width:min(100%,720px); }
  .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.15em; font-weight:700; font-size:.78rem; }
  h1 { margin:.25rem 0; font-size:clamp(2rem,6vw,3rem); line-height:1.1; }
  .intro { color:var(--muted); margin:.5rem 0 1.5rem; }
  .panel { background:rgba(27,32,48,.96); border:1px solid var(--line); border-radius:18px; padding:18px; margin:14px 0; box-shadow:0 12px 30px #0002; }
  label { display:block; font-weight:650; margin-bottom:8px; }
  textarea, .output { width:100%; min-height:125px; padding:14px; border-radius:12px; border:1px solid var(--line); background:#111522; color:var(--text); font:inherit; font-size:1.05rem; overflow-wrap:anywhere; }
  textarea { resize:vertical; outline:none; }
  textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #9b8cff24; }
  .output { min-height:100px; white-space:pre-wrap; word-break:break-word; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .muted { color:var(--muted); font-size:.88rem; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  button { border:1px solid var(--line); border-radius:11px; padding:11px 15px; font:inherit; font-weight:700; color:var(--text); background:#282f43; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#17132b; }
  button:hover { filter:brightness(1.09); }
  button:focus-visible { outline:3px solid white; outline-offset:2px; }
  .mapping { display:grid; grid-template-columns:repeat(auto-fit,minmax(105px,1fr)); gap:8px; }
  .pair { display:flex; justify-content:space-between; gap:10px; padding:9px 11px; background:#111522; border:1px solid var(--line); border-radius:9px; }
  .pair strong { color:var(--accent); font-size:1.2rem; }
  details summary { cursor:pointer; font-weight:700; }
  .notice { color:var(--muted); font-size:.9rem; margin:.9rem 0 0; }
  #status { min-height:1.4em; color:#bcb2ff; font-size:.9rem; margin-top:8px; }
  footer { color:var(--muted); text-align:center; font-size:.82rem; padding:12px 0 24px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">I'm Watching You</div>
  <h1>Greek Cipher</h1>
  <p class="intro">Don't do anything stupid.</p>

  <section class="panel">
    <label for="message">Your message</label>
    <textarea id="message" placeholder="Trust the process"></textarea>
    <div class="bar" style="margin-top:16px">
      <label for="encoded" style="margin:0">Encoded message</label>
      <span class="muted" id="count">0 characters</span>
    </div>
    <div class="output" id="encoded" aria-live="polite">Free Blackmail!!</div>
    <div class="buttons">
      <button class="primary" id="copy">Copy encoded message</button>
      <button id="decode">Decode message</button>
      <button id="clear">Clear</button>
    </div>
    <div id="status" role="status"></div>
    <p class="notice">The C/K issue is fixed now.</p>
  </section>

  <section class="panel">
    <details>
      <summary>Show my cipher alphabet</summary>
      <p class="muted">This is the custom mapping used by the encoder.</p>
      <div class="mapping" id="mapping"></div>
    </details>
  </section>
  <footer>Messages are processed in this page in your browser; nothing is sent to a server.</footer>
</main>
<script>
const mapping = {
  A:"ψ", B:"δ", C:"Δ", K:"κ", D:"ω", E:"α", F:"χ", G:"ι",
  H:"ρ", I:"ε", J:"ξ", L:"ο", M:"θ", N:"ζ", O:"β", P:"υ",
  Q:"φ", R:"μ", S:"η", T:"π", U:"γ", V:"σ", W:"λ", X:"τ",
  Y:"ν", Z:"ϑ"
};
const reverse = {};
for (const [letter, symbol] of Object.entries(mapping)) {
  if (!reverse[symbol]) reverse[symbol] = letter;
}
reverse["κ"] = "K";
reverse["Δ"] = "C";

const input = document.getElementById("message");
const output = document.getElementById("encoded");
const count = document.getElementById("count");
const status = document.getElementById("status");

function encode(text) {
  return [...text].map(ch => mapping[ch.toUpperCase()] || ch).join("");
}
function update() {
  output.textContent = input.value ? encode(input.value) : "";
  count.textContent = `${[...output.textContent].length} characters`;
  status.textContent = "";
}
input.addEventListener("input", update);
document.getElementById("copy").addEventListener("click", async () => {
  if (!input.value) { status.textContent = "Type a message first."; return; }
  try {
    await navigator.clipboard.writeText(encode(input.value));
    status.textContent = "Copied! Your encoded message is on the clipboard.";
  } catch {
    const temp = document.createElement("textarea");
    temp.value = encode(input.value);
    document.body.appendChild(temp);
    temp.select();
    const ok = document.execCommand("copy");
    temp.remove();
    status.textContent = ok ? "Copied! Your encoded message is on the clipboard." : "Copy was blocked by the browser. Select and copy the encoded text manually.";
  }
});
document.getElementById("decode").addEventListener("click", () => {
  if (!input.value) { status.textContent = "Paste an encoded message into the text box first."; return; }
  input.value = [...input.value].map(ch => reverse[ch] || ch).join("");
  update();
  status.textContent = "Decoded as far as possible. κ becomes C/K because both share a symbol.";
});
document.getElementById("clear").addEventListener("click", () => {
  input.value = "";
  update();
  input.focus();
});
const mappingElement = document.getElementById("mapping");
for (const [letter, symbol] of Object.entries(mapping)) {
  if (letter === "K") continue;
  const pair = document.createElement("div");
  pair.className = "pair";
  const left = document.createElement("span");
  left.textContent = letter === "C" ? "C / K" : letter;
  const right = document.createElement("strong");
  right.textContent = symbol;
  pair.append(left, right);
  mappingElement.appendChild(pair);
}
update();
</script>
</body>
</html>
